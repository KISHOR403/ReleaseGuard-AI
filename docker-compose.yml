services:
  postgres:
    image: postgres:16-alpine
    container_name: releaseguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-releaseguard}
      POSTGRES_USER: ${DATABASE_USER:-releaseguard}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change_me}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-releaseguard} -d ${DATABASE_NAME:-releaseguard}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - releaseguard-network

  redis:
    image: redis:7-alpine
    container_name: releaseguard-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - releaseguard-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  releaseguard-network:
    driver: bridge
